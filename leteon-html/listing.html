<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매물 상세 | LETEON 레테온</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @view-transition { navigation: auto; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; background-image: radial-gradient(ellipse 900px 700px at -10% 0%, rgba(163,230,53,0.07) 0%, transparent 100%); min-height: 100vh; display: flex; flex-direction: column; }
    .glass-card { background: rgba(24,24,27,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-card-strong { background: rgba(9,9,11,0.75); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); }
    .glass-input { background: rgba(255,255,255,0.05); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); color: white; outline: none; }
    .line-clamp-1 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; }
    .line-clamp-2 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0a0a0a; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    @media (max-width: 640px) { input, select, textarea { font-size: 16px !important; } }
    @keyframes vt-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes vt-slide-up { from { transform: translateY(10px); } to { transform: translateY(0); } }
    ::view-transition-old(root) { animation: 160ms ease-in both vt-fade-in reverse; }
    ::view-transition-new(root) { animation: 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-fade-in, 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-slide-up; }
    ::view-transition-group(site-header) { animation: none; z-index: 100; }
    ::view-transition-old(site-header) { display: none; }
    ::view-transition-new(site-header) { animation: none; }
    @media (prefers-reduced-motion: reduce) { ::view-transition-old(*), ::view-transition-new(*), ::view-transition-group(*) { animation-duration: 0s !important; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    /* Lightbox */
    #lightbox { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 95vw; max-height: 90vh; object-fit: contain; }
  </style>
</head>
<body class="text-white antialiased">
  <div id="header-placeholder"></div>

  <main class="flex-1">
    <div id="page-content" class="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
      <div class="text-center py-24 text-zinc-600">
        <svg class="w-8 h-8 animate-spin mx-auto mb-3 text-lime-400/40" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
        불러오는 중...
      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" onclick="closeLightbox()">
    <button onclick="closeLightbox(); event.stopPropagation()" class="absolute top-4 right-4 w-10 h-10 flex items-center justify-center text-white bg-black/50 rounded-full hover:bg-black/80 transition-colors z-10">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src
      document.getElementById('lightbox').classList.add('open')
      document.body.style.overflow = 'hidden'
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open')
      document.body.style.overflow = ''
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox() })

    async function toggleStatus(listingId, newStatus) {
      const btn = document.getElementById('status-btn-' + newStatus)
      if (btn) btn.disabled = true
      const { error } = await _sb.from('listings').update({ status: newStatus }).eq('id', listingId)
      if (error) { alert('오류가 발생했습니다: ' + error.message); if (btn) btn.disabled = false; return }
      location.reload()
    }

    async function deleteListing(listingId) {
      if (!confirm('매물을 삭제하시겠습니까?')) return
      const { error } = await _sb.from('listings').update({ status: 'deleted' }).eq('id', listingId)
      if (error) { alert('오류: ' + error.message); return }
      window.location.href = 'my.html'
    }

    async function toggleHeart(toUserId, btn) {
      const user = window._leteonUser
      if (!user) { window.location.href = 'login.html'; return }
      btn.disabled = true
      const countEl = document.getElementById('heart-count')
      const hearted = btn.dataset.hearted === 'true'

      if (hearted) {
        await _sb.from('hearts').delete().eq('from_user_id', user.id).eq('to_user_id', toUserId)
        btn.dataset.hearted = 'false'
        btn.classList.remove('text-lime-400')
        btn.classList.add('text-zinc-500')
        countEl.textContent = parseInt(countEl.textContent) - 1
      } else {
        await _sb.from('hearts').upsert({ from_user_id: user.id, to_user_id: toUserId })
        btn.dataset.hearted = 'true'
        btn.classList.remove('text-zinc-500')
        btn.classList.add('text-lime-400')
        countEl.textContent = parseInt(countEl.textContent) + 1
      }
      btn.disabled = false
    }

    ;(async () => {
      const slug = new URLSearchParams(location.search).get('slug')
      const { user } = await initPage()

      if (!slug) {
        document.getElementById('page-content').innerHTML = '<div class="text-center py-24"><p class="text-zinc-400">매물을 찾을 수 없습니다.</p><a href="listings.html" class="mt-4 inline-block text-lime-400 hover:text-lime-300">← 매물 목록으로</a></div>'
        return
      }

      const { data: listing } = await _sb.from('listings').select('*, profiles(id, username, avatar_url, bio, heart_count, phone)').eq('slug', slug).neq('status', 'deleted').single()

      if (!listing) {
        document.getElementById('page-content').innerHTML = '<div class="text-center py-24"><p class="text-zinc-400 text-lg font-semibold">매물을 찾을 수 없습니다.</p><a href="listings.html" class="mt-4 inline-block text-lime-400 hover:text-lime-300">← 매물 목록으로</a></div>'
        return
      }

      document.title = `${listing.title} | LETEON 레테온`
      const seller = listing.profiles || {}
      const isOwner = user?.id === listing.seller_id
      const isSold = listing.status === 'sold'
      const canDeleteAfter = listing.can_delete_after ? new Date(listing.can_delete_after) : null
      const canDelete = canDeleteAfter ? new Date() >= canDeleteAfter : false

      // Check if current user has hearted this seller
      let hearted = false
      if (user && seller.id && !isOwner) {
        const { data: h } = await _sb.from('hearts').select('id').eq('from_user_id', user.id).eq('to_user_id', seller.id).maybeSingle()
        hearted = !!h
      }

      const imgs = listing.image_urls || []
      const imgHtml = imgs.length > 0 ? `
        <div class="mb-6 space-y-2">
          <div class="relative aspect-[4/3] sm:aspect-square bg-zinc-900 rounded overflow-hidden border border-white/10 cursor-pointer" onclick="openLightbox('${escHtml(imgs[0])}')">
            <img src="${escHtml(imgs[0])}" alt="${escHtml(listing.title)}" class="w-full h-full object-cover">
            ${isSold ? `<div class="absolute inset-0 bg-black/60 flex items-center justify-center"><span class="text-2xl font-black text-white tracking-widest">판매완료</span></div>` : ''}
            <div class="absolute bottom-2 right-2 bg-black/60 text-xs text-white px-2 py-1 rounded">탭하면 크게 보기</div>
          </div>
          ${imgs.length > 1 ? `<div class="grid grid-cols-4 gap-2">${imgs.slice(1, 5).map((u, i) => `<div class="relative aspect-square bg-zinc-900 rounded overflow-hidden border border-white/10 cursor-pointer" onclick="openLightbox('${escHtml(u)}')"><img src="${escHtml(u)}" alt="${escHtml(listing.title)} ${i+2}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" loading="lazy"></div>`).join('')}</div>` : ''}
        </div>` : `
        <div class="aspect-video bg-zinc-900 rounded border border-white/10 flex items-center justify-center mb-8">
          <svg class="w-16 h-16 text-zinc-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>`

      const sellerHtml = seller.id ? `
        <div class="glass-card rounded p-5 mb-8">
          <p class="text-xs font-semibold text-zinc-500 tracking-widest uppercase mb-4">판매자 소개</p>
          <div class="flex items-start justify-between gap-4">
            <a href="profile.html?id=${escHtml(seller.id)}" class="flex items-center gap-3 group min-w-0">
              <div class="relative w-12 h-12 rounded-full bg-zinc-800 overflow-hidden flex-shrink-0 border border-zinc-700">
                ${avatarHtml(seller.avatar_url, seller.username)}
              </div>
              <div class="min-w-0">
                <p class="text-sm font-bold text-white group-hover:text-lime-400 transition-colors">${escHtml(seller.username || '알 수 없음')}</p>
                <p class="text-xs text-zinc-500 mt-0.5">신뢰 <span id="heart-count">${seller.heart_count || 0}</span></p>
              </div>
            </a>
            ${!isOwner ? `
            <button id="heart-btn" data-hearted="${hearted}" onclick="toggleHeart('${escHtml(seller.id)}', this)"
              class="flex-shrink-0 flex items-center gap-1.5 text-xs font-semibold border rounded px-3 py-2 transition-all ${hearted ? 'text-lime-400 border-lime-400/40 bg-lime-400/10' : 'text-zinc-500 border-white/10 hover:border-white/20'}">
              <svg class="w-4 h-4" fill="${hearted ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
              신뢰
            </button>` : ''}
          </div>
          <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${seller.phone ? `<div class="flex items-center gap-3 glass-input rounded px-4 py-3"><svg class="w-4 h-4 text-zinc-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg><div><p class="text-xs text-zinc-500">전화번호</p><p class="text-sm font-semibold text-white">${escHtml(seller.phone)}</p></div></div>` : ''}
            ${listing.location ? `<div class="flex items-center gap-3 glass-input rounded px-4 py-3"><svg class="w-4 h-4 text-zinc-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg><div><p class="text-xs text-zinc-500">거래 지역</p><p class="text-sm font-semibold text-white">${escHtml(listing.location)}</p></div></div>` : ''}
          </div>
          ${seller.bio ? `<p class="mt-4 text-sm text-zinc-400 leading-relaxed border-t border-white/[0.06] pt-4">${escHtml(seller.bio)}</p>` : ''}
        </div>` : ''

      const specsHtml = listing.specs && Object.keys(listing.specs).length > 0 ? `
        <div class="glass-card rounded p-5 mb-6">
          <h2 class="text-xs font-semibold text-zinc-500 tracking-widest uppercase mb-4">스펙</h2>
          <dl class="space-y-2">
            ${Object.entries(listing.specs).map(([k, v]) => `<div class="flex gap-3 text-sm"><dt class="text-zinc-500 w-32 shrink-0">${escHtml(k)}</dt><dd class="text-zinc-200">${escHtml(String(v))}</dd></div>`).join('')}
          </dl>
        </div>` : ''

      const ownerActions = isOwner ? `
        <div class="glass-card rounded p-5 mb-6">
          <h2 class="text-xs font-semibold text-zinc-500 tracking-widest uppercase mb-4">내 매물 관리</h2>
          <div class="flex flex-wrap gap-3">
            ${listing.status === 'active' ? `<button id="status-btn-sold" onclick="toggleStatus('${listing.id}', 'sold')" class="text-sm font-semibold border border-blue-500/40 text-blue-400 hover:bg-blue-500/10 px-4 py-2 rounded transition-colors">판매완료로 변경</button>` : ''}
            ${listing.status === 'sold' ? `<button id="status-btn-active" onclick="toggleStatus('${listing.id}', 'active')" class="text-sm font-semibold border border-lime-400/40 text-lime-400 hover:bg-lime-400/10 px-4 py-2 rounded transition-colors">판매중으로 변경</button>` : ''}
            ${canDelete ? `<button onclick="deleteListing('${listing.id}')" class="text-sm font-semibold border border-red-500/40 text-red-400 hover:bg-red-500/10 px-4 py-2 rounded transition-colors">삭제</button>` : canDeleteAfter ? `<p class="text-sm text-zinc-500 self-center">${canDeleteAfter.toLocaleDateString('ko-KR')} 이후 삭제 가능</p>` : ''}
          </div>
        </div>` : ''

      document.getElementById('page-content').innerHTML = `
        <nav class="flex items-center gap-1.5 text-xs sm:text-sm text-zinc-500 mb-6">
          <a href="index.html" class="hover:text-lime-400 transition-colors shrink-0">홈</a>
          <span>/</span>
          <a href="listings.html" class="hover:text-lime-400 transition-colors shrink-0">매물</a>
          <span>/</span>
          <a href="listings.html?category=${escHtml(listing.category)}" class="hover:text-lime-400 transition-colors shrink-0">${escHtml(listing.category)}</a>
        </nav>

        <div class="mb-6">
          <div class="flex items-center gap-2 mb-3 flex-wrap">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-zinc-800/90 text-zinc-200">${escHtml(listing.category)}</span>
            ${listing.condition ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-zinc-900/80 text-zinc-400">${escHtml(CONDITION_LABEL[listing.condition] || listing.condition)}</span>` : ''}
            ${isSold ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-red-900/80 text-red-300">판매완료</span>` : ''}
          </div>
          <h1 class="text-xl sm:text-3xl font-black text-white leading-tight">${escHtml(listing.title)}</h1>
          <p class="mt-2 text-2xl sm:text-3xl font-black font-mono text-lime-400">${formatPrice(listing.price)}</p>
          <p class="mt-1 text-xs text-zinc-600">등록일: ${new Date(listing.created_at).toLocaleDateString('ko-KR')}</p>
        </div>

        ${sellerHtml}
        ${imgHtml}

        <div class="glass-card rounded p-5 mb-6">
          <h2 class="text-xs font-semibold text-zinc-500 tracking-widest uppercase mb-4">상품 설명</h2>
          ${listing.description
            ? `<p class="text-sm text-zinc-200 leading-relaxed whitespace-pre-line">${escHtml(listing.description)}</p>`
            : `<p class="text-sm text-zinc-600">등록된 설명이 없습니다.</p>`}
        </div>

        ${specsHtml}
        ${ownerActions}
      `
    })()
  </script>
</body>
</html>
