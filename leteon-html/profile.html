<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 | LETEON 레테온</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @view-transition { navigation: auto; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; background-image: radial-gradient(ellipse 900px 700px at -10% 0%, rgba(163,230,53,0.07) 0%, transparent 100%); min-height: 100vh; display: flex; flex-direction: column; }
    .glass-card { background: rgba(24,24,27,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .line-clamp-1 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; }
    .line-clamp-2 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0a0a0a; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    @keyframes vt-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes vt-slide-up { from { transform: translateY(10px); } to { transform: translateY(0); } }
    ::view-transition-old(root) { animation: 160ms ease-in both vt-fade-in reverse; }
    ::view-transition-new(root) { animation: 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-fade-in, 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-slide-up; }
    ::view-transition-group(site-header) { animation: none; z-index: 100; }
    ::view-transition-old(site-header) { display: none; }
    ::view-transition-new(site-header) { animation: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="text-white antialiased">
  <div id="header-placeholder"></div>

  <main class="flex-1">
    <div id="page-content" class="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
      <div class="text-center py-24 text-zinc-600">
        <svg class="w-8 h-8 animate-spin mx-auto mb-3 text-lime-400/40" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
        불러오는 중...
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    async function toggleHeart(toUserId, btn) {
      const user = window._leteonUser
      if (!user) { window.location.href = 'login.html'; return }
      btn.disabled = true
      const countEl = document.getElementById('heart-count')
      const hearted = btn.dataset.hearted === 'true'

      if (hearted) {
        await _sb.from('hearts').delete().eq('from_user_id', user.id).eq('to_user_id', toUserId)
        btn.dataset.hearted = 'false'
        btn.querySelector('.heart-text').textContent = '신뢰 보내기'
        btn.classList.remove('bg-lime-400/10', 'border-lime-400/40', 'text-lime-400')
        btn.classList.add('text-zinc-400', 'border-white/10')
        if (countEl) countEl.textContent = parseInt(countEl.textContent) - 1
      } else {
        await _sb.from('hearts').upsert({ from_user_id: user.id, to_user_id: toUserId })
        btn.dataset.hearted = 'true'
        btn.querySelector('.heart-text').textContent = '신뢰 취소'
        btn.classList.add('bg-lime-400/10', 'border-lime-400/40', 'text-lime-400')
        btn.classList.remove('text-zinc-400', 'border-white/10')
        if (countEl) countEl.textContent = parseInt(countEl.textContent) + 1
      }
      btn.disabled = false
    }

    ;(async () => {
      const profileId = new URLSearchParams(location.search).get('id')
      const { user } = await initPage()

      if (!profileId) {
        document.getElementById('page-content').innerHTML = '<div class="text-center py-24"><p class="text-zinc-400">프로필을 찾을 수 없습니다.</p><a href="index.html" class="mt-4 inline-block text-lime-400">홈으로</a></div>'
        return
      }

      const [{ data: profile }, { data: listings }] = await Promise.all([
        _sb.from('profiles').select('id, username, avatar_url, bio, heart_count, created_at').eq('id', profileId).single(),
        _sb.from('listings').select('*').eq('seller_id', profileId).eq('status', 'active').order('created_at', { ascending: false })
      ])

      if (!profile) {
        document.getElementById('page-content').innerHTML = '<div class="text-center py-24"><p class="text-zinc-400">사용자를 찾을 수 없습니다.</p></div>'
        return
      }

      document.title = `${profile.username || '사용자'} | LETEON 레테온`

      const isOwner = user?.id === profileId
      let hearted = false
      if (user && !isOwner) {
        const { data: h } = await _sb.from('hearts').select('id').eq('from_user_id', user.id).eq('to_user_id', profileId).maybeSingle()
        hearted = !!h
      }

      const initial = (String(profile.username || '?')[0]).toUpperCase()
      const avatarEl = profile.avatar_url
        ? `<img src="${escHtml(profile.avatar_url)}" alt="${escHtml(profile.username)}" class="w-full h-full object-cover">`
        : `<div class="w-full h-full flex items-center justify-center text-3xl font-black text-zinc-400">${initial}</div>`

      const joinDate = profile.created_at ? new Date(profile.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long' }) : null

      const heartBtn = !isOwner ? `
        <button id="heart-main-btn" data-hearted="${hearted}" onclick="toggleHeart('${escHtml(profileId)}', this)"
          class="flex items-center gap-2 text-sm font-semibold border rounded-full px-5 py-2 transition-all ${hearted ? 'bg-lime-400/10 border-lime-400/40 text-lime-400' : 'text-zinc-400 border-white/10 hover:border-white/20'}">
          <svg class="w-4 h-4" fill="${hearted ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
          <span class="heart-text">${hearted ? '신뢰 취소' : '신뢰 보내기'}</span>
        </button>` : ''

      const listingsGrid = !listings || listings.length === 0 ? `
        <div class="text-center py-16"><p class="text-zinc-500 text-sm">활성 매물이 없습니다.</p></div>` :
        `<div class="grid grid-cols-2 sm:grid-cols-3 gap-4">${listings.map(l => listingCardHtml(l)).join('')}</div>`

      document.getElementById('page-content').innerHTML = `
        <div class="glass-card rounded p-6 mb-8">
          <div class="flex items-start justify-between gap-4">
            <div class="flex items-center gap-4">
              <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-zinc-800 overflow-hidden border border-zinc-700 flex-shrink-0">${avatarEl}</div>
              <div>
                <h1 class="text-xl sm:text-2xl font-black text-white">${escHtml(profile.username || '알 수 없음')}</h1>
                <p class="text-sm text-zinc-500 mt-1">신뢰 <span id="heart-count">${profile.heart_count || 0}</span></p>
                ${joinDate ? `<p class="text-xs text-zinc-600 mt-0.5">${joinDate} 가입</p>` : ''}
              </div>
            </div>
            ${heartBtn}
          </div>
          ${profile.bio ? `<p class="mt-5 pt-4 border-t border-white/[0.06] text-sm text-zinc-400 leading-relaxed">${escHtml(profile.bio)}</p>` : ''}
        </div>

        <div>
          <h2 class="text-base font-bold text-white mb-4">판매 중인 매물 (${listings?.length || 0})</h2>
          ${listingsGrid}
        </div>
      `
    })()

    function escHtml(str) { return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
  </script>
</body>
</html>
