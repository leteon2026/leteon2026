<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유저 관리 | LETEON Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @view-transition { navigation: auto; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; min-height: 100vh; display: flex; flex-direction: column; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0a0a0a; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    @keyframes vt-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes vt-slide-up { from { transform: translateY(10px); } to { transform: translateY(0); } }
    ::view-transition-old(root) { animation: 160ms ease-in both vt-fade-in reverse; }
    ::view-transition-new(root) { animation: 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-fade-in, 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-slide-up; }
    ::view-transition-group(site-header) { animation: none; z-index: 100; }
    ::view-transition-old(site-header) { display: none; }
    ::view-transition-new(site-header) { animation: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="text-white antialiased">
  <div id="header-placeholder"></div>

  <div class="flex flex-1 min-h-0">
    <aside class="hidden md:flex w-52 shrink-0 flex-col bg-zinc-900/80 border-r border-white/[0.06] p-4 gap-1">
      <p class="text-[10px] font-bold text-zinc-600 uppercase tracking-wider px-3 pb-2 mt-2">관리</p>
      <a href="index.html" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
        대시보드
      </a>
      <a href="listings.html" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        매물 관리
      </a>
      <a href="users.html" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded bg-lime-400/10 text-lime-400">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        유저 관리
      </a>
      <div class="mt-auto pt-4 border-t border-white/[0.06]">
        <a href="../index.html" class="flex items-center gap-2 px-3 py-2 text-sm text-zinc-500 hover:text-white rounded hover:bg-zinc-800 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          사이트로
        </a>
      </div>
    </aside>

    <main class="flex-1 overflow-x-hidden p-4 sm:p-6 md:p-8">
      <div id="page-content">
        <div class="text-center py-24 text-zinc-600">
          <svg class="w-8 h-8 animate-spin mx-auto mb-3 text-lime-400/40" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          불러오는 중...
        </div>
      </div>
    </main>
  </div>

  <div id="footer-placeholder" class="hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/common.js"></script>
  <script>
    ;(async () => {
      const { user } = await initPage()
      if (!user || user.email !== ADMIN_EMAIL) { window.location.href = '../index.html'; return }

      const { data: users } = await _sb.from('profiles')
        .select('id, username, email, phone, heart_count, created_at, deleted_at')
        .order('created_at', { ascending: false })

      document.getElementById('page-content').innerHTML = `
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-black text-white">유저 관리</h1>
            <p class="mt-1 text-sm text-zinc-400">전체 ${users?.length ?? 0}명</p>
          </div>
          <div class="relative">
            <input id="search-input" type="text" placeholder="닉네임, 이메일 검색..." oninput="filterUsers(this.value)"
              class="bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2 text-sm text-white placeholder-zinc-600 outline-none focus:border-lime-400/50 w-48 sm:w-64 transition-colors">
          </div>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
          <div id="users-table" class="overflow-x-auto">
            ${renderUsersTable(users || [])}
          </div>
        </div>
      `
      window._allUsers = users || []
    })()

    function renderUsersTable(list) {
      if (list.length === 0) return '<p class="text-zinc-400 text-sm text-center py-8">사용자가 없습니다.</p>'
      return `<table class="w-full text-sm">
        <thead><tr class="border-b border-zinc-800">
          <th class="text-left py-3 px-4 text-xs font-semibold text-zinc-500 uppercase tracking-wider">유저</th>
          <th class="text-left py-3 px-4 text-xs font-semibold text-zinc-500 uppercase tracking-wider hidden sm:table-cell">이메일</th>
          <th class="text-left py-3 px-4 text-xs font-semibold text-zinc-500 uppercase tracking-wider hidden md:table-cell">전화번호</th>
          <th class="text-left py-3 px-4 text-xs font-semibold text-zinc-500 uppercase tracking-wider hidden lg:table-cell">가입일</th>
          <th class="text-left py-3 px-4 text-xs font-semibold text-zinc-500 uppercase tracking-wider">상태</th>
          <th class="text-left py-3 px-4 text-xs font-semibold text-zinc-500 uppercase tracking-wider">작업</th>
        </tr></thead>
        <tbody class="divide-y divide-zinc-900">
          ${list.map(u => `
          <tr class="hover:bg-zinc-800/30 transition-colors">
            <td class="py-3 px-4">
              <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-zinc-700 flex items-center justify-center text-xs font-bold text-zinc-300 flex-shrink-0">
                  ${(String(u.username || u.email || '?')[0]).toUpperCase()}
                </div>
                <div>
                  <p class="font-medium text-white">${escHtml(u.username || '—')}</p>
                  <p class="text-xs text-zinc-500">신뢰 ${u.heart_count || 0}</p>
                </div>
              </div>
            </td>
            <td class="py-3 px-4 text-zinc-400 hidden sm:table-cell">${escHtml(u.email || '—')}</td>
            <td class="py-3 px-4 text-zinc-400 hidden md:table-cell">${escHtml(u.phone || '—')}</td>
            <td class="py-3 px-4 text-zinc-500 hidden lg:table-cell">${u.created_at ? new Date(u.created_at).toLocaleDateString('ko-KR') : '—'}</td>
            <td class="py-3 px-4">
              ${u.deleted_at
                ? '<span class="text-xs font-semibold text-red-400 bg-red-500/10 border border-red-500/20 px-2 py-0.5 rounded">탈퇴</span>'
                : '<span class="text-xs font-semibold text-lime-400 bg-lime-400/10 border border-lime-400/20 px-2 py-0.5 rounded">활성</span>'
              }
            </td>
            <td class="py-3 px-4">
              <a href="../profile.html?id=${escHtml(u.id)}" class="text-xs text-zinc-400 hover:text-white border border-white/10 hover:border-white/20 px-2.5 py-1 rounded transition-colors">프로필</a>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`
    }

    function filterUsers(q) {
      const list = (window._allUsers || []).filter(u => {
        const s = q.toLowerCase()
        return !s || (u.username || '').toLowerCase().includes(s) || (u.email || '').toLowerCase().includes(s)
      })
      document.getElementById('users-table').innerHTML = renderUsersTable(list)
    }

    function escHtml(str) { return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
  </script>
</body>
</html>
