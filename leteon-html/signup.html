<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | LETEON 레테온</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @view-transition { navigation: auto; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; background-image: radial-gradient(ellipse 900px 700px at -10% 0%, rgba(163,230,53,0.07) 0%, transparent 100%); min-height: 100vh; display: flex; flex-direction: column; }
    .glass-card-strong { background: rgba(9,9,11,0.75); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); }
    .glass-input { background: rgba(255,255,255,0.05); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); color: white; outline: none; transition: border-color 0.2s, background 0.2s; }
    .glass-input:focus { border-color: rgba(163,230,53,0.6); background: rgba(255,255,255,0.07); }
    .glass-input::placeholder { color: rgba(161,161,170,0.5); }
    .glass-input.error { border-color: rgba(239,68,68,0.6); }
    @media (max-width: 640px) { input, select, textarea { font-size: 16px !important; } }
    @keyframes vt-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes vt-slide-up { from { transform: translateY(10px); } to { transform: translateY(0); } }
    ::view-transition-old(root) { animation: 160ms ease-in both vt-fade-in reverse; }
    ::view-transition-new(root) { animation: 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-fade-in, 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-slide-up; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="text-white antialiased">

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <a href="index.html" class="inline-block">
          <p class="text-3xl font-black text-lime-400 tracking-widest">LETEON</p>
          <p class="mt-0.5 text-zinc-500 text-xs font-medium tracking-widest uppercase">Korea Bike Marketplace</p>
        </a>
      </div>

      <div class="glass-card-strong rounded p-7 shadow-2xl shadow-black/50">
        <h1 class="text-base font-bold text-white mb-1 text-center">회원가입</h1>
        <p class="text-zinc-500 text-sm text-center mb-6">계정을 만들어 시작하세요</p>

        <div id="global-error" class="hidden mb-5 p-3 bg-red-500/10 border border-red-500/30 rounded text-sm text-red-400 text-center"></div>

        <form id="signup-form" novalidate class="space-y-4">
          <!-- 닉네임 -->
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1.5 tracking-wide uppercase">닉네임 <span class="text-lime-400">*</span></label>
            <input id="username" type="text" maxlength="20" placeholder="2~20자" class="w-full glass-input rounded px-4 py-2.5 text-sm">
            <div class="flex justify-between mt-1">
              <p id="err-username" class="text-xs text-red-400 hidden"></p>
              <p id="cnt-username" class="text-xs text-zinc-600 ml-auto">0/20</p>
            </div>
          </div>

          <!-- 이메일 -->
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1.5 tracking-wide uppercase">이메일 <span class="text-lime-400">*</span></label>
            <input id="email" type="email" autocomplete="email" placeholder="example@email.com" class="w-full glass-input rounded px-4 py-2.5 text-sm">
            <p id="err-email" class="mt-1 text-xs text-red-400 hidden"></p>
          </div>

          <!-- 비밀번호 -->
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1.5 tracking-wide uppercase">비밀번호 <span class="text-lime-400">*</span></label>
            <div class="relative">
              <input id="password" type="password" autocomplete="new-password" placeholder="6자 이상" class="w-full glass-input rounded px-4 py-2.5 pr-11 text-sm">
              <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300 transition-colors" tabindex="-1">
                <svg id="eye1" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
              </button>
            </div>
            <p id="err-password" class="mt-1 text-xs text-red-400 hidden"></p>
          </div>

          <!-- 비밀번호 확인 -->
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1.5 tracking-wide uppercase">비밀번호 확인 <span class="text-lime-400">*</span></label>
            <div class="relative">
              <input id="confirm-password" type="password" autocomplete="new-password" placeholder="비밀번호 재입력" class="w-full glass-input rounded px-4 py-2.5 pr-11 text-sm">
              <button type="button" id="toggle-pw2" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300 transition-colors" tabindex="-1">
                <svg id="eye2" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
              </button>
            </div>
            <p id="err-confirm" class="mt-1 text-xs text-red-400 hidden"></p>
          </div>

          <!-- 전화번호 -->
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1.5 tracking-wide uppercase">전화번호 <span class="text-lime-400">*</span></label>
            <input id="phone" type="tel" autocomplete="tel" placeholder="010-0000-0000" class="w-full glass-input rounded px-4 py-2.5 text-sm">
            <p id="err-phone" class="mt-1 text-xs text-red-400 hidden"></p>
          </div>

          <!-- 약관 -->
          <div class="pt-1">
            <label class="flex items-start gap-3 cursor-pointer group">
              <div class="relative mt-0.5 flex-shrink-0">
                <input type="checkbox" id="terms-check" class="sr-only">
                <div id="checkbox-ui" class="w-4 h-4 rounded border border-white/20 bg-white/5 group-hover:border-white/40 transition-colors flex items-center justify-center">
                  <svg id="check-icon" class="w-3 h-3 text-zinc-950 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                </div>
              </div>
              <span class="text-xs text-zinc-400 leading-relaxed">
                레테온의 <a href="terms.html" target="_blank" class="text-lime-400 underline underline-offset-2 hover:text-lime-300">이용약관</a> 및 <a href="privacy.html" target="_blank" class="text-lime-400 underline underline-offset-2 hover:text-lime-300">개인정보처리방침</a>에 동의합니다.
              </span>
            </label>
            <p id="err-terms" class="mt-1 text-xs text-red-400 hidden pl-7"></p>
          </div>

          <button type="submit" id="submit-btn"
            class="w-full bg-lime-400 hover:bg-lime-300 active:bg-lime-500 disabled:opacity-50 disabled:cursor-not-allowed text-zinc-950 font-bold py-3 px-4 rounded transition-colors text-sm mt-2 active:scale-[0.96]">
            회원가입
          </button>
        </form>

        <p class="mt-5 text-center text-sm text-zinc-500">
          이미 계정이 있으신가요? <a href="login.html" class="text-lime-400 hover:text-lime-300 font-medium">로그인</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://ytxrbayjaebiiquprhlx.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0eHJiYXlqYWViaWlxdXByaGx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MzIxMjUsImV4cCI6MjA5ODMwODEyNX0.9VZNyaPECXbfi2bnyVb4LIgJhh7DTExDFydS-ahlvHg'
    const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    const PHONE_RE = /^01[016789][-\s]?\d{3,4}[-\s]?\d{4}$/

    // Toggle password visibility
    function makeToggle(btnId, inputId, eyeId) {
      let show = false
      document.getElementById(btnId).addEventListener('click', () => {
        show = !show
        document.getElementById(inputId).type = show ? 'text' : 'password'
        document.getElementById(eyeId).innerHTML = show
          ? `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`
          : `<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`
      })
    }
    makeToggle('toggle-pw', 'password', 'eye1')
    makeToggle('toggle-pw2', 'confirm-password', 'eye2')

    // Username counter
    document.getElementById('username').addEventListener('input', function() {
      document.getElementById('cnt-username').textContent = this.value.length + '/20'
    })

    // Custom checkbox
    let termsChecked = false
    document.getElementById('terms-check').addEventListener('change', function() {
      termsChecked = this.checked
      const ui = document.getElementById('checkbox-ui')
      const icon = document.getElementById('check-icon')
      if (termsChecked) {
        ui.classList.add('bg-lime-400', 'border-lime-400')
        ui.classList.remove('bg-white/5', 'border-white/20')
        icon.classList.remove('hidden')
      } else {
        ui.classList.remove('bg-lime-400', 'border-lime-400')
        ui.classList.add('bg-white/5', 'border-white/20')
        icon.classList.add('hidden')
      }
    })

    function showErr(id, msg) {
      const el = document.getElementById(id)
      if (msg) { el.textContent = msg; el.classList.remove('hidden') }
      else { el.textContent = ''; el.classList.add('hidden') }
    }

    function validate() {
      let ok = true
      const username = document.getElementById('username').value.trim()
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const confirm = document.getElementById('confirm-password').value
      const phone = document.getElementById('phone').value.trim()

      if (!username || username.length < 2) { showErr('err-username', '닉네임은 2자 이상이어야 합니다.'); ok = false } else showErr('err-username', '')
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('err-email', '올바른 이메일 형식이 아닙니다.'); ok = false } else showErr('err-email', '')
      if (!password || password.length < 6) { showErr('err-password', '비밀번호는 6자 이상이어야 합니다.'); ok = false } else showErr('err-password', '')
      if (!confirm || confirm !== password) { showErr('err-confirm', '비밀번호가 일치하지 않습니다.'); ok = false } else showErr('err-confirm', '')
      if (!phone || !PHONE_RE.test(phone.replace(/\s/g, ''))) { showErr('err-phone', '올바른 형식이 아닙니다. (예: 010-1234-5678)'); ok = false } else showErr('err-phone', '')
      if (!termsChecked) { showErr('err-terms', '이용약관에 동의해주세요.'); ok = false } else showErr('err-terms', '')
      return ok
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      if (!validate()) return

      const btn = document.getElementById('submit-btn')
      const errEl = document.getElementById('global-error')
      btn.disabled = true
      btn.innerHTML = `<span class="flex items-center justify-center gap-2"><svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>처리 중...</span>`
      errEl.classList.add('hidden')

      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const username = document.getElementById('username').value.trim()
      const phone = document.getElementById('phone').value.trim()

      // Signup via Supabase Auth
      const { data, error } = await _sb.auth.signUp({ email, password, options: { data: { username } } })
      if (error) {
        errEl.textContent = error.message.includes('already') ? '이미 사용 중인 이메일입니다.' : '회원가입 중 오류가 발생했습니다.'
        errEl.classList.remove('hidden')
        btn.disabled = false; btn.textContent = '회원가입'
        return
      }

      // Update profile with username and phone
      if (data.user) {
        await _sb.from('profiles').upsert({ id: data.user.id, username, phone, email }, { onConflict: 'id' })
      }

      // Auto login
      const { error: loginErr } = await _sb.auth.signInWithPassword({ email, password })
      if (loginErr) {
        window.location.href = 'login.html?message=가입이 완료되었습니다. 로그인해주세요.'
        return
      }
      window.location.href = 'index.html'
    })
  </script>
</body>
</html>
