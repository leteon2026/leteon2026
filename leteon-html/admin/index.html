<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 | LETEON</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @view-transition { navigation: auto; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; min-height: 100vh; display: flex; flex-direction: column; }
    .glass-card { background: rgba(24,24,27,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-card-strong { background: rgba(9,9,11,0.75); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0a0a0a; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    @keyframes vt-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes vt-slide-up { from { transform: translateY(10px); } to { transform: translateY(0); } }
    ::view-transition-old(root) { animation: 160ms ease-in both vt-fade-in reverse; }
    ::view-transition-new(root) { animation: 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-fade-in, 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-slide-up; }
    ::view-transition-group(site-header) { animation: none; z-index: 100; }
    ::view-transition-old(site-header) { display: none; }
    ::view-transition-new(site-header) { animation: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    .line-clamp-1 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; }
  </style>
</head>
<body class="text-white antialiased">
  <div id="header-placeholder"></div>

  <div class="flex flex-1 min-h-0">
    <!-- Admin Sidebar -->
    <aside class="hidden md:flex w-52 shrink-0 flex-col bg-zinc-900/80 border-r border-white/[0.06] p-4 gap-1">
      <p class="text-[10px] font-bold text-zinc-600 uppercase tracking-wider px-3 pb-2 mt-2">관리</p>
      <a href="index.html" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded bg-lime-400/10 text-lime-400">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
        대시보드
      </a>
      <a href="listings.html" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        매물 관리
      </a>
      <a href="users.html" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        유저 관리
      </a>
      <div class="mt-auto pt-4 border-t border-white/[0.06]">
        <a href="../index.html" class="flex items-center gap-2 px-3 py-2 text-sm text-zinc-500 hover:text-white rounded hover:bg-zinc-800 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          사이트로
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-x-hidden p-4 sm:p-6 md:p-8">
      <div id="page-content">
        <div class="text-center py-24 text-zinc-600">
          <svg class="w-8 h-8 animate-spin mx-auto mb-3 text-lime-400/40" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          불러오는 중...
        </div>
      </div>
    </main>
  </div>

  <div id="footer-placeholder" class="hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/common.js"></script>
  <script>
    ;(async () => {
      const { user } = await initPage()
      if (!user || user.email !== ADMIN_EMAIL) { window.location.href = '../index.html'; return }

      const [
        { count: activeListings },
        { count: totalUsers },
        { data: recentListings }
      ] = await Promise.all([
        _sb.from('listings').select('*', { count: 'exact', head: true }).eq('status', 'active'),
        _sb.from('profiles').select('*', { count: 'exact', head: true }),
        _sb.from('listings').select('*, profiles(username)').neq('status', 'deleted').order('created_at', { ascending: false }).limit(5)
      ])

      const statusColor = { draft: 'text-yellow-400', active: 'text-lime-400', sold: 'text-blue-400', deleted: 'text-zinc-500' }
      const statusLabel = { draft: '미결제', active: '판매중', sold: '판매완료', deleted: '삭제됨' }

      document.getElementById('page-content').innerHTML = `
        <h1 class="text-2xl font-black text-white mb-8">대시보드</h1>

        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-10">
          <a href="listings.html" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 hover:border-zinc-700 transition-colors">
            <p class="text-sm font-medium text-zinc-400">활성 매물</p>
            <p class="mt-2 text-3xl font-black text-lime-400">${activeListings ?? 0}</p>
          </a>
          <a href="users.html" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 hover:border-zinc-700 transition-colors">
            <p class="text-sm font-medium text-zinc-400">전체 유저</p>
            <p class="mt-2 text-3xl font-black text-lime-400">${totalUsers ?? 0}</p>
          </a>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
          <div class="flex items-center justify-between mb-5">
            <h2 class="text-base font-bold text-white">최근 매물</h2>
            <a href="listings.html" class="text-sm text-lime-400 hover:text-lime-300 font-medium">전체보기 →</a>
          </div>
          ${!recentListings || recentListings.length === 0
            ? '<p class="text-zinc-400 text-sm text-center py-8">매물이 없습니다.</p>'
            : recentListings.map(l => `
              <div class="flex items-center justify-between py-3.5 border-b border-zinc-800 last:border-0">
                <div>
                  <p class="text-sm font-semibold text-white line-clamp-1">${escHtml(l.title)}</p>
                  <p class="text-sm text-zinc-400 mt-0.5">${escHtml(l.profiles?.username || '?')} · ${escHtml(l.category)}</p>
                </div>
                <span class="text-sm font-semibold ${statusColor[l.status] || 'text-zinc-400'}">${statusLabel[l.status] || l.status}</span>
              </div>`).join('')
          }
        </div>
      `
    })()

    function escHtml(str) { return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
  </script>
</body>
</html>
