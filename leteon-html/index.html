<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LETEON 레테온 | 중고 바이크 직거래</title>
  <meta name="description" content="MTB·eMTB·eBike·Parts 중고 바이크 C2C 직거래 플랫폼">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @view-transition { navigation: auto; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; background-image: radial-gradient(ellipse 900px 700px at -10% 0%, rgba(163,230,53,0.07) 0%, transparent 100%), radial-gradient(ellipse 700px 500px at 110% 100%, rgba(163,230,53,0.04) 0%, transparent 100%); min-height: 100vh; display: flex; flex-direction: column; }
    .glass-card { background: rgba(24,24,27,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-card-strong { background: rgba(9,9,11,0.75); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); }
    .glass-input { background: rgba(255,255,255,0.05); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); color: white; outline: none; transition: border-color 0.2s, background 0.2s; }
    .glass-input:focus { border-color: rgba(163,230,53,0.6); background: rgba(255,255,255,0.07); }
    .glass-input::placeholder { color: rgba(161,161,170,0.6); }
    .hero-pattern { background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(163,230,53,0.1) 0%, transparent 100%), linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: auto, 40px 40px, 40px 40px; }
    .line-clamp-1 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; }
    .line-clamp-2 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0a0a0a; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; } ::-webkit-scrollbar-thumb:hover { background: #a3e635; }
    @media (max-width: 640px) { input, select, textarea { font-size: 16px !important; } }
    @keyframes vt-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes vt-slide-up { from { transform: translateY(10px); } to { transform: translateY(0); } }
    ::view-transition-old(root) { animation: 160ms ease-in both vt-fade-in reverse; }
    ::view-transition-new(root) { animation: 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-fade-in, 260ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-slide-up; }
    ::view-transition-group(site-header) { animation: none; z-index: 100; }
    ::view-transition-old(site-header) { display: none; }
    ::view-transition-new(site-header) { animation: none; }
    @media (prefers-reduced-motion: reduce) { ::view-transition-old(*), ::view-transition-new(*), ::view-transition-group(*) { animation-duration: 0s !important; animation-delay: 0s !important; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="text-white antialiased">
  <div id="header-placeholder"></div>

  <main class="flex-1">
    <!-- Hero Section -->
    <section class="hero-pattern relative overflow-hidden py-16 sm:py-24 md:py-32 px-4">
      <div class="relative max-w-7xl mx-auto text-center">
        <p class="text-xs font-bold text-lime-400 tracking-[0.3em] uppercase mb-6">Korea Bike Marketplace</p>
        <h1 class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl font-black text-white leading-none tracking-tight">
          LETEON
        </h1>
        <p class="mt-4 text-xl sm:text-2xl font-black text-zinc-500 tracking-widest">레테온</p>
        <p class="mt-6 text-base sm:text-lg text-zinc-400 font-medium leading-relaxed max-w-md mx-auto">
          MTB · eMTB · eBike · Parts<br>
          <span class="text-zinc-500">중고 바이크 C2C 직거래 플랫폼</span>
        </p>
        <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3 w-full max-w-xs sm:max-w-none mx-auto">
          <a href="listings.html" class="w-full sm:w-auto inline-flex items-center justify-center bg-lime-400 text-black font-bold text-base px-7 py-3 rounded hover:bg-lime-300 active:scale-[0.96] transition-all duration-200 select-none">
            전체 매물 보기
          </a>
          <a href="new-listing.html" class="w-full sm:w-auto inline-flex items-center justify-center border border-zinc-600 text-zinc-300 hover:border-lime-400 hover:text-lime-400 font-semibold text-base px-7 py-3 rounded active:scale-[0.96] transition-all duration-200 select-none">
            + 매물 등록
          </a>
        </div>
        <!-- 장식 -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-lime-400/[0.03] rounded-full blur-3xl pointer-events-none"></div>
      </div>
    </section>

    <!-- Category Section -->
    <section class="py-10 sm:py-16 px-4 sm:px-6 max-w-7xl mx-auto">
      <div class="mb-10">
        <p class="text-xs font-bold text-zinc-500 tracking-[0.2em] uppercase mb-2">Browse</p>
        <h2 class="text-2xl font-black text-white">카테고리</h2>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <a href="listings.html?category=MTB" class="glass-card rounded group p-5 hover:border-lime-400/40 transition-all duration-300 hover:shadow-lg hover:shadow-lime-400/5 active:scale-[0.97] active:opacity-80">
          <div class="text-zinc-500 group-hover:text-lime-400 transition-colors duration-300 mb-3">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/></svg>
          </div>
          <div class="text-sm font-bold text-white group-hover:text-lime-400 transition-colors duration-300">MTB</div>
          <div class="mt-1 text-xs text-zinc-500 leading-relaxed">산악 마운틴 바이크</div>
        </a>
        <a href="listings.html?category=eMTB" class="glass-card rounded group p-5 hover:border-lime-400/40 transition-all duration-300 hover:shadow-lg hover:shadow-lime-400/5 active:scale-[0.97] active:opacity-80">
          <div class="text-zinc-500 group-hover:text-lime-400 transition-colors duration-300 mb-3">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <div class="text-sm font-bold text-white group-hover:text-lime-400 transition-colors duration-300">eMTB</div>
          <div class="mt-1 text-xs text-zinc-500 leading-relaxed">전동 MTB</div>
        </a>
        <a href="listings.html?category=eBike" class="glass-card rounded group p-5 hover:border-lime-400/40 transition-all duration-300 hover:shadow-lg hover:shadow-lime-400/5 active:scale-[0.97] active:opacity-80">
          <div class="text-zinc-500 group-hover:text-lime-400 transition-colors duration-300 mb-3">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12a7 7 0 1 0 14 0A7 7 0 0 0 5 12z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3l2 2M12 5V3M12 19v2"/></svg>
          </div>
          <div class="text-sm font-bold text-white group-hover:text-lime-400 transition-colors duration-300">eBike</div>
          <div class="mt-1 text-xs text-zinc-500 leading-relaxed">전기 자전거</div>
        </a>
        <a href="listings.html?category=Parts" class="glass-card rounded group p-5 hover:border-lime-400/40 transition-all duration-300 hover:shadow-lg hover:shadow-lime-400/5 active:scale-[0.97] active:opacity-80">
          <div class="text-zinc-500 group-hover:text-lime-400 transition-colors duration-300 mb-3">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l5.654-4.654m5.965-3.641a3 3 0 0 1-4.243 4.243"/></svg>
          </div>
          <div class="text-sm font-bold text-white group-hover:text-lime-400 transition-colors duration-300">Parts</div>
          <div class="mt-1 text-xs text-zinc-500 leading-relaxed">부품 &amp; 악세서리</div>
        </a>
      </div>
    </section>

    <!-- Recent Listings Section -->
    <section class="py-10 sm:py-16 px-4 sm:px-6 max-w-7xl mx-auto">
      <div class="flex items-center justify-between mb-8">
        <div>
          <p class="text-xs font-bold text-zinc-500 tracking-[0.2em] uppercase mb-2">Latest</p>
          <h2 class="text-2xl font-black text-white">최신 매물</h2>
        </div>
        <a href="listings.html" class="text-sm text-lime-400 hover:text-lime-300 font-medium transition-colors">
          전체보기 →
        </a>
      </div>
      <div id="recent-listings" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
        <div class="col-span-full text-center py-16 text-zinc-600">
          <svg class="w-8 h-8 animate-spin mx-auto mb-3 text-lime-400/40" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          불러오는 중...
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async () => {
      await initPage()

      // Load recent listings
      const { data: listings, error } = await _sb
        .from('listings')
        .select('*, profiles(id, username, avatar_url)')
        .eq('status', 'active')
        .order('created_at', { ascending: false })
        .limit(8)

      const el = document.getElementById('recent-listings')
      if (error || !listings || listings.length === 0) {
        el.innerHTML = `<div class="col-span-full text-center py-16"><p class="text-zinc-400 font-medium">등록된 매물이 없습니다.</p><div class="mt-4"><a href="new-listing.html" class="text-sm text-lime-400 hover:text-lime-300 font-medium">첫 번째 매물을 등록해보세요 →</a></div></div>`
        return
      }
      el.innerHTML = listings.map(l => listingCardHtml(l)).join('')
    })()
  </script>
</body>
</html>
